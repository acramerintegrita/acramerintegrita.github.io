---
layout: default
---
<article>
  <div class="page-head">
    <div class="page-head-in">
      <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time>{% if page.tag %} · {{ page.tag }}{% endif %}</p>
      <h1 class="sec-t">{{ page.title }}</h1>
      {%- if page.untertitel %}
      <p class="sec-st">{{ page.untertitel }}</p>
      {%- endif %}
    </div>
  </div>
  <div class="sec">
    <div class="prose">
{{ content }}
    </div>
    <p><a href="{{ '/insights/' | relative_url }}">← Alle Insights</a></p>
  </div>
</article>
