# =============================================================================
# _config.yml – zentrale Einstellungen der Integrita-Website
#
# Hier stehen alle Angaben, die auf mehreren Seiten vorkommen (Kontakt,
# Impressum, Datenschutz, Footer). Einmal hier ändern -> überall aktuell.
#
# Leere Werte ("") werden auf der Seite als gelber Platzhalter angezeigt,
# damit nichts vergessen wird.
#
# WICHTIG: Nach Änderungen an DIESER Datei baut GitHub die Seite neu
# (dauert 1–2 Minuten). Texte in Anführungszeichen setzen.
# =============================================================================

title: "Integrita – Audit & Advisory"
tagline: "Informationssicherheit & Datenschutz"
description: "Integrita Audit & Advisory – Informationssicherheit & Datenschutz. Pragmatisch gedacht. Unabhängig geprüft. Externer DSB, ISB, Zertifizierungsaudits ISO 27001 & 9001, München."
lang: de_DE
# Logo für Suchmaschinen (strukturierte Daten). Quelle: Design-Repo integrita-design
logo: /assets/images/logo/integrita-signet-512.png

# Adresse der Website. Bei eigener Domain hier eintragen (und Datei CNAME anlegen).
url: "https://acramerintegrita.github.io"
baseurl: ""

# --- Kontakt- und Impressumsangaben -----------------------------------------
kontakt:
  name: "Andreas J. Cramer"
  firma: "Integrita – Audit & Advisory"
  strasse: "Am Fablhof 17"                     # z. B. "Musterstraße 1"
  plz: "85640"                         # z. B. "85640"
  ort: "Putzbrunn"
  ort_kurz: "Putzbrunn bei München"
  email: "acramer.integrita@gmail.com"                       # z. B. "kontakt@integrita.de"
  telefon: "+49 1707312628"                     # z. B. "+49 89 123456"
  linkedin: "https://www.linkedin.com/in/andreas-cramer-6508358/"                    # vollständige URL zum LinkedIn-Profil
  ust_id: ""                      # USt-IdNr., z. B. "DE123456789"

# --- Kontaktformular ----------------------------------------------------------
# Das Formular wird über Formspring (formspring.io, Pixel & Process UG, Lübeck)
# versendet. Daten liegen in Deutschland, AVV nach Art. 28 DSGVO.
# Hier steht die vollständige Formular-Adresse aus dem Formspring-Dashboard
# (frmsp.io ist die Kurz-Domain von Formspring).
# Solange das Feld leer ist, zeigt die Kontaktseite nur die E-Mail-Adresse.
# Die Content-Security-Policy übernimmt den Server aus dieser Adresse automatisch.
# Wird der Anbieter gewechselt: datenschutz.html (Abschnitt 5) anpassen.
kontaktformular_url: "https://frmsp.io/f/Bly92W0Gb2JI"

# --- Datenschutzerklärung -----------------------------------------------------
datenschutz_stand: "November 2026"

# --- Jekyll -------------------------------------------------------------------
permalink: /insights/:year/:title/
markdown: kramdown
timezone: Europe/Berlin

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: insights/feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Ordner mit Punkt am Anfang veröffentlicht Jekyll nur, wenn sie hier stehen
include:
  - .well-known

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - _privat
  - CLAUDE.md
  - HANDBUCH.md
